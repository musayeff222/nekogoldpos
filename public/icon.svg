<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    
    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="20%" stop-color="#ca8a04" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="85%" stop-color="#a16207" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Gold Accent Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />

  <!-- Outer Elegant Gold Circular Frame -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.8" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="12 6" opacity="0.6" />

  <!-- Stylized Elegant Neko Face + N Motif (Representing Neko Gold) -->
  <g filter="url(#goldGlow)" transform="translate(128, 128)">
    <!-- Ears -->
    <path d="M 40 80 L 10 10 L 110 50 Z" fill="url(#goldGrad)" />
    <path d="M 216 80 L 246 10 L 146 50 Z" fill="url(#goldGrad)" />
    
    <!-- Face / Shield shape to represent security/stability -->
    <path d="M 40 80 L 216 80 L 216 160 C 216 230, 128 250, 128 250 C 128 250, 40 230, 40 160 Z" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Central N Symbol in Gold -->
    <path d="M 75 180 L 75 100 L 181 180 L 181 100" fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Whiskers / Accents -->
    <line x1="20" y1="130" x2="50" y2="135" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    <line x1="20" y1="150" x2="50" y2="148" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    <line x1="236" y1="130" x2="206" y2="135" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    <line x1="236" y1="150" x2="206" y2="148" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Title/Wordmark Accent -->
  <text x="256" y="440" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="28" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">NEKO GOLD</text>
</svg>
